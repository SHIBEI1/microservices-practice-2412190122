name: pet-hospital

services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请设置 NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?请设置 NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?请设置 NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-28080}:8080"
      - "127.0.0.1:${NACOS_SERVER_PORT:-18848}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-19848}:9848"
    volumes:
      - nacos_data:/home/nacos/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped

  mysql:
    profiles: ["monolith"]
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pet_hospital}
      MYSQL_USER: ${MYSQL_USER:-pet_hospital}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}"
          --silent --skip-column-names -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  app:
    profiles: ["monolith"]
    image: pet-hospital:week05
    build:
      context: ./monolith
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-pet_hospital}?connectionTimeZone=Asia/Shanghai&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-pet_hospital}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    restart: unless-stopped

  pet-db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${PET_DATABASE:-pet_hospital_pet}
      MYSQL_USER: ${PET_DB_USERNAME:-pet_user}
      MYSQL_PASSWORD: ${PET_DB_PASSWORD:?请设置 PET_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pet_data:/var/lib/mysql
    mem_limit: 512m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}"
          --silent --skip-column-names -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  pet-service: &pet-service
    image: pet-hospital-pet:week08
    build:
      context: ./services/pet-service
    ports:
      - "127.0.0.1:${PET_SERVICE_PORT:-18082}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://pet-db:3306/${PET_DATABASE:-pet_hospital_pet}?connectionTimeZone=Asia/Shanghai&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true
      DB_USERNAME: ${PET_DB_USERNAME:-pet_user}
      DB_PASSWORD: ${PET_DB_PASSWORD:?请设置 PET_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?请设置 NACOS_PASSWORD}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_GROUP: ${NACOS_GROUP:-PET_HOSPITAL_GROUP}
      TZ: Asia/Shanghai
    depends_on:
      nacos:
        condition: service_healthy
      pet-db:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    restart: unless-stopped

  pet-service-replica:
    <<: *pet-service
    ports: []
    depends_on:
      pet-service:
        condition: service_healthy

  doctor-db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${DOCTOR_DATABASE:-pet_hospital_doctor}
      MYSQL_USER: ${DOCTOR_DB_USERNAME:-doctor_user}
      MYSQL_PASSWORD: ${DOCTOR_DB_PASSWORD:?请设置 DOCTOR_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - doctor_data:/var/lib/mysql
    mem_limit: 512m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}"
          --silent --skip-column-names -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  doctor-service:
    image: pet-hospital-doctor:week07
    build:
      context: ./services/doctor-service
    ports:
      - "127.0.0.1:${DOCTOR_SERVICE_PORT:-18083}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://doctor-db:3306/${DOCTOR_DATABASE:-pet_hospital_doctor}?connectionTimeZone=Asia/Shanghai&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DOCTOR_DB_USERNAME:-doctor_user}
      DB_PASSWORD: ${DOCTOR_DB_PASSWORD:?请设置 DOCTOR_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?请设置 NACOS_PASSWORD}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_GROUP: ${NACOS_GROUP:-PET_HOSPITAL_GROUP}
      TZ: Asia/Shanghai
    depends_on:
      nacos:
        condition: service_healthy
      doctor-db:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    restart: unless-stopped

  appointment-db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${APPOINTMENT_DATABASE:-pet_hospital_appointment}
      MYSQL_USER: ${APPOINTMENT_DB_USERNAME:-appointment_user}
      MYSQL_PASSWORD: ${APPOINTMENT_DB_PASSWORD:?请设置 APPOINTMENT_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - appointment_data:/var/lib/mysql
    mem_limit: 512m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}"
          --silent --skip-column-names -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  appointment-service:
    image: pet-hospital-appointment:week08
    build:
      context: ./services/appointment-service
    ports:
      - "127.0.0.1:${APPOINTMENT_SERVICE_PORT:-18084}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://appointment-db:3306/${APPOINTMENT_DATABASE:-pet_hospital_appointment}?connectionTimeZone=Asia/Shanghai&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true
      DB_USERNAME: ${APPOINTMENT_DB_USERNAME:-appointment_user}
      DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD:?请设置 APPOINTMENT_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?请设置 NACOS_PASSWORD}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_GROUP: ${NACOS_GROUP:-PET_HOSPITAL_GROUP}
      TZ: Asia/Shanghai
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-2s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-3s}
    depends_on:
      nacos:
        condition: service_healthy
      appointment-db:
        condition: service_healthy
      pet-service:
        condition: service_healthy
      doctor-service:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    restart: unless-stopped

volumes:
  nacos_data:
  mysql_data:
  pet_data:
  doctor_data:
  appointment_data:
