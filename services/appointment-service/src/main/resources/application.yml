server:
  port: ${SERVER_PORT:18084}
spring:
  application:
    name: appointment-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pet_hospital_appointment?connectionTimeZone=Asia/Shanghai&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:appointment_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info

clients:
  pet-base-url: ${PET_SERVICE_URL:http://localhost:18082}
  doctor-base-url: ${DOCTOR_SERVICE_URL:http://localhost:18083}
  connect-timeout: ${HTTP_CONNECT_TIMEOUT:2s}
  read-timeout: ${HTTP_READ_TIMEOUT:3s}
