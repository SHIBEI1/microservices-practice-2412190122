server:
  port: ${SERVER_PORT:18083}
spring:
  application:
    name: doctor-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pet_hospital_doctor?connectionTimeZone=Asia/Shanghai&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:doctor_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
